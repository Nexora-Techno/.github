
name: Feature Request
description: Suggest a new feature or improvement.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        We appreciate ideas that help improve Nexora-Techno projects.

  - type: input
    id: project
    attributes:
      label: Project Name
      placeholder: Project name
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other solutions?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add examples, mockups, or relevant information.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Verification
      options:
        - label: I have checked that this feature has not already been requested.
          required: true
